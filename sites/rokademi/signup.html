
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت نام | آکادمی رکاد</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<section class="signup-container">

<div class="signup-box">

<img src="images/logo.png" alt="لوگو">

<h1>فرم ثبت نام</h1>

<p>اطلاعات خود را کامل وارد کنید.</p>

<form id="signupForm">

<label>نام</label>
<input type="text" id="name" required>

<label>نام خانوادگی</label>
<input type="text" id="family" required>

<label>سن</label>
<input type="number" id="age" min="10" max="70" required>

<label>شهر</label>
<input type="text" id="city" required>

<label>شماره تماس</label>
<input type="tel" id="phone" maxlength="11" placeholder="09*********" required>

<label>به چه مهارت‌هایی علاقه دارید؟</label>

<select id="skill">

<option>برنامه نویسی وب</option>

<option>پایتون</option>

<option>هوش مصنوعی</option>

<option>رباتیک</option>

<option>طراحی سایت</option>

<option>جاوا</option>

<option>سی شارپ</option>

<option>امنیت شبکه</option>

</select>

<label>دانش‌آموز هنرستان رکاد هستید؟</label>

<div class="radio-group">

<label>

<input type="radio" name="student" value="yes" checked>

بله

</label>

<label>

<input type="radio" name="student" value="no">

خیر

</label>

</div>

<div id="schoolBox">

<label>نام مدرسه</label>

<input type="text" id="schoolName">

</div>

<button type="submit">

ثبت نام

</button>

</form>

<div class="login-link">

<p>

قبلاً ثبت نام کرده‌اید؟

</p>

<a href="login.html">

ورود به حساب

</a>

</div>

<div class="back-home">

<a href="index.html">

<i class="fa-solid fa-house"></i>

بازگشت به صفحه اصلی

</a>

</div>

</div>

</section>

<script src="js/signup.js"></script>

</body>

</html>
