
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سبد خرید | آکادمی رکاد</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- Header -->

<header class="cart-header">

    <h1>سبد خرید شما</h1>

    <div class="header-actions">

        <a href="courses.html" class="back-btn">
            <i class="fa-solid fa-arrow-right"></i>
            بازگشت به دوره‌ها
        </a>

        <a href="index.html" class="home-btn">
            <i class="fa-solid fa-house"></i>
            صفحه اصلی
        </a>

    </div>

</header>

<!-- Cart Section -->

<section class="cart-container">

    <div id="cartItems">

        <!-- آیتم‌ها با JS اضافه می‌شوند -->

        <p class="empty">سبد خرید شما خالی است</p>

    </div>

    <div class="cart-summary">

        <h2>جمع کل:</h2>

        <span id="totalPrice">0 تومان</span>

        <button onclick="checkout()">

            ثبت نهایی و پرداخت

        </button>

    </div>

</section>

<!-- Footer -->

<footer class="cart-footer">

    <p>با ثبت نهایی، دوره‌های انتخابی شما رزرو خواهند شد</p>

</footer>

<script src="js/cart.js"></script>

</body>

</html>
