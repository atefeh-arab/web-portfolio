
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود | آکادمی رکاد</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <section class="login-container">

        <div class="login-box">
            <img src="assets/a_vector_style_digital_graphic_of_a_logo_is_displa.png" alt="لوگو">

            <h1>ورود به حساب کاربری</h1>

            <p>
                برای ورود شماره همراه خود را وارد کنید.
            </p>

            <form id="loginForm">

                <label>شماره همراه</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="09*********"
                    maxlength="11"
                    required>

                <button
                    type="button"
                    id="sendCode">

                    <i class="fa-solid fa-paper-plane"></i>

                    دریافت کد تایید

                </button>

                <div id="codeBox">

                    <label>کد تایید</label>

                    <input
                        type="text"
                        id="otp"
                        maxlength="5"
                        placeholder="کد ارسال شده">

                    <button type="submit">

                        ورود

                    </button>

                </div>

            </form>

            <hr>

            <div class="signup-link">

                <p>

                    حساب کاربری ندارید؟

                </p>

                <a href="signup.html">

                    ثبت نام

                </a>

            </div>

            <div class="back-home">

                <a href="index.html">

                    <i class="fa-solid fa-house"></i>

                    بازگشت به صفحه اصلی

                </a>

            </div>

        </div>

    </section>

    <script src="js/login.js"></script>

</body>

</html>
